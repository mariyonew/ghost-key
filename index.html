<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 90%;
        }
        h1 { color: #00ff88; }
        .progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff88;
            border-radius: 10px;
            animation: load 3s forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status { color: #aaa; font-size: 14px; }

        /* ===== INPUT FIELD (For testing) ===== */
        #testInput {
            margin-top: 20px;
            padding: 12px;
            width: 80%;
            max-width: 400px;
            background: #333;
            border: 2px solid #00ff88;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        #testInput:focus {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }

        /* ===== DEBUG PANEL ===== */
        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            color: #00ff88;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 9999;
            border: 1px solid #00ff88;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 System Update</h1>
        <p>Optimizing system performance...</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="status">✅ Update completed successfully</p>
    </div>

    <!-- ===== TEST INPUT ===== -->
    <input type="text" id="testInput" placeholder="Type here to test..." autofocus>

    <!-- ===== DEBUG PANEL ===== -->
    <div id="debug">🟢 Waiting for events...</div>

    <script>
        // ===== DEBUG FUNCTION =====
        function debug(msg) {
            const el = document.getElementById('debug');
            const time = new Date().toLocaleTimeString();
            el.innerHTML = `[${time}] ${msg}\n` + el.innerHTML;
            if (el.innerHTML.split('\n').length > 20) {
                el.innerHTML = el.innerHTML.split('\n').slice(0, 20).join('\n');
            }
        }

        debug("🚀 Page loaded");

        // ===== REGISTER SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => {
                    debug("✅ Service Worker registered");
                })
                .catch(err => {
                    debug("❌ SW registration failed: " + err.message);
                });
        } else {
            debug("❌ Service Worker not supported");
        }

        // ===== KEYBOARD TEST =====
        const input = document.getElementById('testInput');
        input.focus();

        document.addEventListener('keydown', (e) => {
            debug("🔑 Key pressed: " + e.key);
        });

        input.addEventListener('input', (e) => {
            debug("✏️ Input changed: " + e.target.value);
        });

        debug("✅ Ghost Key activated! Type in the input field above.");
    </script>
</body>
</html>
