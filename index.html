<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        h1 { color: #00ff88; }
        .progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff88;
            border-radius: 10px;
            animation: load 3s forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 System Update</h1>
        <p>Optimizing system performance...</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p class="status">✅ Update completed successfully</p>
    </div>

    <script>
        // ===== REGISTER SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => {
                    console.log('✅ Service Worker registered');
                })
                .catch(err => {
                    console.log('❌ SW registration failed:', err);
                });
        }

        // ===== NO AUTO-CLOSE =====
        console.log('✅ Ghost Key activated! Close this tab manually.');
    </script>
</body>
</html>
